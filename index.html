<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KDS-Werte-Check</title>
<style>
:root{color-scheme:light;--bg:#f6f6f2;--card:#fff;--ink:#23262b;--mute:#5d6269;--line:#dcdcd5;
--L:#0a5fae;--Ll:#e6f0f9;--G:#d81b7f;--Gl:#fce8f3;--V:#2f8a3e;--Vl:#e7f4e9;--O:#7a5a00;--Ol:#fff6d6;--N:#3d4a5c;--Nl:#eef1f5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.45 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
main{max-width:680px;margin:auto;padding:16px 16px 50px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:14px}
.center{text-align:center}
.logo{width:130px;height:130px}
h1{font-size:1.6rem;margin:6px 0 8px}
h2{font-size:1.2rem;margin:0 0 8px}
p{margin:0 0 10px}
.mute{color:var(--mute)}
.small{font-size:.9rem}
label.f{display:block;margin:12px 0 4px;font-weight:600}
input[type=text],textarea{width:100%;border:1px solid #aaa;border-radius:8px;padding:9px;background:#fff}
textarea{min-height:80px}
.btn{border:1px solid #999;background:#fff;border-radius:10px;padding:11px 16px}
.btn.p{background:var(--ink);color:#fff;border-color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.vals{display:grid;gap:8px;margin:12px 0}
.val{border-left:6px solid var(--c);background:var(--cl);border-radius:10px;padding:9px 12px}
.val b{color:var(--c)}
.cL{--c:var(--L);--cl:var(--Ll)}.cG{--c:var(--G);--cl:var(--Gl)}.cV{--c:var(--V);--cl:var(--Vl)}.cO{--c:var(--O);--cl:var(--Ol)}
.toggle{display:flex;gap:10px;align-items:center;margin-top:12px;font-weight:600}
.toggle input{width:22px;height:22px}
.hud{display:flex;justify-content:space-between;gap:8px;font-size:.95rem;color:var(--mute);margin-bottom:8px}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--L),var(--G),var(--V));transition:width .3s}
.tag{display:inline-block;font-size:.82rem;background:#ecedef;border-radius:10px;padding:2px 9px;margin:0 4px 4px 0}
.rule{font-size:1.35rem;font-weight:600;margin:8px 0 16px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ch{border:2px solid var(--c);background:var(--cl);border-radius:12px;padding:13px 9px;font-weight:700;font-size:1.05rem}
.ch small{display:block;font-weight:400;font-size:.85rem;margin-top:4px;line-height:1.3}
.ch small b{font-weight:600}
.easy{font-style:italic}
.ch.pick{background:var(--c);color:#fff}
.ch:disabled{cursor:default}
.ch:disabled:not(.pick){opacity:.5}
.duo{background:var(--Nl);border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:.95rem}
.fb{margin-top:14px;padding:12px;border-radius:10px;background:var(--Nl);border-left:6px solid var(--N);animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.97);opacity:.4}to{transform:none;opacity:1}}
.fb b{display:block}
.ask{margin-top:14px}
.ask p{font-weight:600;margin-bottom:7px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.opt{border:1px solid #888;background:#fff;border-radius:10px;padding:10px 4px;font-size:.95rem}
.opt[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.likert{border-top:1px solid var(--line);padding:12px 0}
.likert p{font-weight:600;margin-bottom:7px}
.badge{display:inline-block;font-size:1.1rem;font-weight:700;border:3px solid var(--ink);border-radius:999px;padding:8px 18px;margin:6px 0 10px}
.mine{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:10px 0}
.mine div{border-top:5px solid var(--c);background:var(--cl);border-radius:8px;padding:8px 4px;text-align:center;font-size:.85rem}
.mine b{display:block;font-size:1.4rem}
.sentnote{background:var(--Ol);border-radius:10px;padding:10px 12px;margin:12px 0 0}
.alt{margin-top:14px}.alt summary{cursor:pointer;color:var(--mute)}.alt p{margin:8px 0 0}
.link{background:none;border:0;text-decoration:underline;color:var(--mute);padding:2px}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 15px;border-radius:9px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.on{opacity:1}
@media (max-width:560px){.choices{grid-template-columns:1fr}.mine{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<main id="main"></main>
<div id="toast" role="status"></div>

 const INK=[.14,.15,.17],GREY=[.36,.38,.42];
 const text=(t,x,yy,size,b,col)=>{c+=`BT /F${b?2:1} ${size} Tf ${color(col||INK)} rg ${x} ${yy.toFixed(1)} Td ${pdfStr(t)} Tj ET\n`};
 const para=(t,size,b,col,gap=3)=>{const lh=size*1.3;wrap(t,size,b,CW).forEach(l=>{need(lh);y-=lh;text(l,M,y,size,b,col)});y-=gap};
 const RES={r:[.18,.54,.24],t:[.54,.39,0],w:[.70,.22,.16]},RL={r:'gleich',t:'vertretbar',w:'anders'};
 if(logo)c+=`q 64 0 0 64 ${W-M-64} ${H-M-64} cm /Im1 Do Q\n`;
 text('KDS-Regelspiel: Auswertung',M,y-22,19,true);y-=34;
 d.meta.forEach(m=>para(m,11,false,INK,2));
 y=Math.min(y,H-M-80);
 if(d.stats){const S=d.stats,bw=(CW-20)/3,top=y-46;
 [['gleich',S.r,'r'],['vertretbar',S.t,'t'],['anders',S.w,'w']].forEach(([n,v,k],i)=>{const x=M+i*(bw+10);
  c+=`${color(RES[k])} rg ${x} ${top} ${bw} 44 re f\n`;text(String(v),x+10,top+15,20,true,[1,1,1]);text(n,x+46,top+17,12,false,[1,1,1])});
 y=top-8;
 para(`Punkte: ${S.pts} von ${S.max}. „Gleich“: wie der Arbeitsvorschlag des Teams. „Vertretbar“: die Regel passt laut Vorschlag auch zu diesem Wert.`,9,false,GREY);}
 d.blocks.forEach(b=>{
  if(b.h){need(44);y-=12;para(b.h,13,true)}
  else if(b.p!==undefined)para(b.p,b.size||10.5,!!b.b,INK,b.gap===undefined?3:b.gap);
  else if(b.row){const r=b.row,lines=wrap(r.t,10.5,true,CW);need(lines.length*14+18);
   lines.forEach(l=>{y-=14;text(l,M,y,10.5,true)});
   const ll=wrap(r.line+RL[r.res],9.5,false,CW);
   ll.forEach((l,i)=>{y-=12.5;if(i===ll.length-1&&l.endsWith(RL[r.res])){const pre=l.slice(0,l.length-RL[r.res].length);text(pre,M,y,9.5,false,GREY);text(RL[r.res],M+strW(pre,9.5,false),y,9.5,true,RES[r.res])}else text(l,M,y,9.5,false,GREY)});
   y-=2;r.extra.forEach(e=>para(e,9.5,false,INK,0));y-=6}
 });
 newPage();
 const n=pages.length,objs=[],first=logo?6:5,kids=[];
 for(let i=0;i<n;i++)kids.push(`${first+i*2} 0 R`);
 objs[1]='<</Type/Catalog/Pages 2 0 R>>';
 objs[2]=`<</Type/Pages/Count ${n}/Kids[${kids.join(' ')}]>>`;
 objs[3]='<</Type/Font/Subtype/Type1/BaseFont/Helvetica/Encoding/WinAnsiEncoding>>';
 objs[4]='<</Type/Font/Subtype/Type1/BaseFont/Helvetica-Bold/Encoding/WinAnsiEncoding>>';
 if(logo){const bin=atob(logo),sz=jpegSize(bin);objs[5]=`<</Type/XObject/Subtype/Image/Width ${sz[0]}/Height ${sz[1]}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${bin.length}>>\nstream\n${bin}\nendstream`}
 pages.forEach((p,i)=>{
  const body=p+`BT /F1 8 Tf .45 .45 .45 rg ${W-M-40} 26 Td ${pdfStr('Seite '+(i+1)+' von '+n)} Tj ET\n`,pn=first+i*2;
  objs[pn]=`<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${W} ${H}]/Resources<</Font<</F1 3 0 R/F2 4 0 R>>${logo?'/XObject<</Im1 5 0 R>>':''}>>/Contents ${pn+1} 0 R>>`;
  objs[pn+1]=`<</Length ${body.length}>>\nstream\n${body}endstream`;
 });
 let out='%PDF-1.4\n';const off=[];
 for(let i=1;i<objs.length;i++){off[i]=out.length;out+=`${i} 0 obj\n${objs[i]}\nendobj\n`}
 const xr=out.length;
 out+=`xref\n0 ${objs.length}\n0000000000 65535 f \n`;
 for(let i=1;i<objs.length;i++)out+=String(off[i]).padStart(10,'0')+' 00000 n \n';
 return out+`trailer\n<</Size ${objs.length}/Root 1 0 R>>\nstartxref\n${xr}\n%%EOF`;
}
function jpegSize(b){let i=2;while(i<b.length){const m=b.charCodeAt(i+1),l=b.charCodeAt(i+2)*256+b.charCodeAt(i+3);if(m>=192&&m<=194)return[b.charCodeAt(i+7)*256+b.charCodeAt(i+8),b.charCodeAt(i+5)*256+b.charCodeAt(i+6)];i+=2+l}return[100,100]}
/*PDF-END*/
function flush(){const f=$('#fehlt');if(f)s.fehlt=f.value;const o=$('#sonst');if(o)s.sonst=o.value;save()}
function pick(k){const id=s.order[s.pos];if(s.ans[id])return;s.ans[id]={p:k,f:''};save();render();const fb=$('.fb');if(fb&&fb.getBoundingClientRect().bottom>innerHeight)fb.scrollIntoView({behavior:'smooth',block:'center'})}
document.addEventListener('click',e=>{
 const t=e.target.closest('button');if(!t||t.disabled)return;const d=t.dataset;
 if('start' in d){s=fresh($('#grp').value.trim(),$('#duo').checked);s.order=draw();s.screen='play';save();render()}
 else if('resume' in d){s.screen='play';save();render()}
 else if(d.pick)pick(d.pick);
 else if(d.find){const a=s.ans[s.order[s.pos]];a.f=a.f===d.find?'':d.find;save();document.querySelectorAll('[data-find]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.find===a.f))}
 else if('next' in d){s.pos++;save();render()}
 else if('home' in d){s.screen='start';save();render()}
 else if(d.q!==undefined){flush();s.q[d.q]=+d.v;save();document.querySelectorAll(`[data-q="${d.q}"]`).forEach(b=>b.setAttribute('aria-pressed',+b.dataset.v===s.q[d.q]))}
 else if('toend' in d){flush();s.screen='end';save();render()}
 else if('send' in d){window.open(formUrl(),'_blank','noopener');s.sent=true;save();render()}
 else if('pdf' in d){const a=document.createElement('a');a.href=URL.createObjectURL(pdfBlob());a.download=pdfName();document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('PDF erstellt. Schick sie jetzt in Teams.')}
 else if('share' in d){navigator.share({files:[new File([pdfBlob()],pdfName(),{type:'application/pdf'})],title:'KDS-Werte-Check'}).catch(()=>{})}
 else if('again' in d){if(confirm('Hast du die PDF schon verschickt? Eine neue Runde löscht dieses Ergebnis.')){s=fresh(s.grp,s.duo);save();render()}}
});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='fehlt'){s.fehlt=t.value;save()}else if(t.id==='sonst'){s.sonst=t.value;save()}});
document.addEventListener('keydown',e=>{
 if(s.screen!=='play'||/INPUT|TEXTAREA/.test(e.target.tagName)||e.ctrlKey||e.metaKey||e.altKey)return;
 const k={1:'L',2:'G',3:'V',4:'O'}[e.key];
 if(k)pick(k);else if(e.key==='Enter'&&s.ans[s.order[s.pos]]){e.preventDefault();s.pos++;save();render()}
});
render();
</script>
</body>
</html>
